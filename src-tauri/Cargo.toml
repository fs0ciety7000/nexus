[package]
name = "nexus-dashboard"
version = "0.1.0"
description = "A high-performance command center for power users"
authors = ["PhantomHex"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
# Tauri Core
tauri = { version = "2.0.0", features = ["macos-private-api"] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Type Safety Bridge
specta = { version = "2.0.0-rc.7", features = ["export"] }
tauri-specta = { version = "2.0.0-rc.2", features = ["derive", "typescript"] }

# System Monitoring
sysinfo = "0.30.5"
nvml-wrapper = "0.9.0"

# Filesystem & Path utilities
walkdir = "2.4.0"
home = "0.5.9"

# Async Runtime
tokio = { version = "1.35", features = ["full"] }

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Markdown Parsing (for Obsidian)
pulldown-cmark = "0.9"
gray-matter = "0.2"

# Filesystem Watching
notify = "6.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
